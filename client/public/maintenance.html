<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Servicio temporalmente suspendido</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #5f6675;
      --accent: #e8a33d;
      --border: #e3e6eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b1f27;
        --text: #eceff4;
        --muted: #a2a9b6;
        --accent: #f0b453;
        --border: #2a303b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.6;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 32px; height: 32px; stroke: var(--accent); }
    h1 { font-size: 1.5rem; font-weight: 650; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 1rem; }
    p + p { margin-top: 12px; }
    .contact {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
    }
    .contact a { color: var(--text); font-weight: 600; text-decoration: none; }
    .contact a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="4" width="4" height="16" rx="1"></rect>
        <rect x="14" y="4" width="4" height="16" rx="1"></rect>
      </svg>
    </div>
    <h1>Servicio temporalmente suspendido</h1>
    <p>Esta aplicación no está disponible en este momento.</p>
    <p>El acceso se restablecerá tan pronto se resuelva la situación con el administrador del servicio.</p>
    <div class="contact">
      ¿Eres el administrador? Escríbenos a
      <a href="mailto:hola@virtuala.com.co">hola@virtuala.com.co</a>
    </div>
  </main>
</body>
</html>
